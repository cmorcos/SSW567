version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.12

    steps:
      - checkout

      - run:
          name: Install requests
          command: pip install requests

      - run:
          name: Run triangle tests
          command: python3 -m unittest -v test_triangle.py

      - run:
          name: Run GitHub API tests
          command: python3 -m unittest -v "GitHubApi - hw03a/test_github_api.py"

workflows:
  test-workflow:
    jobs:
      - build